[metadata]
name = alumniumcucumber
version = 0.1.0
author = neuno.ai
description = Zero-code Gherkin/BDD adapter for Alumnium
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/iammac2/alumnium-cucumber
python_requires = >=3.10

[options]
# Full per-step metrics/artifacts reporting requires an Alumnium version that exposes
# `al.metrics`/`al.artifacts_dir` (alumnium-hq/alumnium#293). Older versions are tolerated
# via graceful degradation; pin a minimum version here once that release is published.
packages = find:
install_requires =
    alumnium[playwright]
    behave

[options.entry_points]
console_scripts =
    alumnium-report = alumniumcucumber.reporting.cli:main

[options.extras_require]
test =
    pytest
